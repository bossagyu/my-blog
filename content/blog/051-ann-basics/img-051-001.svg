<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="sans-serif">
  <rect width="760" height="380" fill="#ffffff"/>

  <!-- left panel: brute force -->
  <text x="190" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#2c3e50">全探索（kNN）</text>
  <rect x="20" y="50" width="340" height="260" rx="8" fill="#f8f9fa" stroke="#d5dbe1"/>

  <!-- lines from query to every point -->
  <g stroke="#c0c8d0" stroke-width="1">
    <line x1="190" y1="180" x2="60" y2="90"/>
    <line x1="190" y1="180" x2="110" y2="140"/>
    <line x1="190" y1="180" x2="80" y2="210"/>
    <line x1="190" y1="180" x2="140" y2="250"/>
    <line x1="190" y1="180" x2="120" y2="80"/>
    <line x1="190" y1="180" x2="180" y2="110"/>
    <line x1="190" y1="180" x2="230" y2="70"/>
    <line x1="190" y1="180" x2="280" y2="100"/>
    <line x1="190" y1="180" x2="310" y2="150"/>
    <line x1="190" y1="180" x2="300" y2="220"/>
    <line x1="190" y1="180" x2="260" y2="260"/>
    <line x1="190" y1="180" x2="200" y2="280"/>
    <line x1="190" y1="180" x2="150" y2="180"/>
    <line x1="190" y1="180" x2="240" y2="160"/>
    <line x1="190" y1="180" x2="330" y2="250"/>
    <line x1="190" y1="180" x2="60" y2="280"/>
    <line x1="190" y1="180" x2="320" y2="90"/>
    <line x1="190" y1="180" x2="40" y2="160"/>
  </g>
  <g fill="#4a7ebb">
    <circle cx="60" cy="90" r="5"/><circle cx="110" cy="140" r="5"/><circle cx="80" cy="210" r="5"/>
    <circle cx="140" cy="250" r="5"/><circle cx="120" cy="80" r="5"/><circle cx="180" cy="110" r="5"/>
    <circle cx="230" cy="70" r="5"/><circle cx="280" cy="100" r="5"/><circle cx="310" cy="150" r="5"/>
    <circle cx="300" cy="220" r="5"/><circle cx="260" cy="260" r="5"/><circle cx="200" cy="280" r="5"/>
    <circle cx="150" cy="180" r="5"/><circle cx="240" cy="160" r="5"/><circle cx="330" cy="250" r="5"/>
    <circle cx="60" cy="280" r="5"/><circle cx="320" cy="90" r="5"/><circle cx="40" cy="160" r="5"/>
  </g>
  <g transform="translate(190,180)">
    <polygon points="0,-11 2.65,-3.64 10.46,-3.4 4.28,1.39 6.47,8.9 0,4.5 -6.47,8.9 -4.28,1.39 -10.46,-3.4 -2.65,-3.64" fill="#e74c3c"/>
  </g>
  <text x="190" y="208" text-anchor="middle" font-size="12" fill="#e74c3c">クエリ</text>
  <text x="190" y="338" text-anchor="middle" font-size="13" fill="#555">すべての点と距離計算（1億件なら1億回）</text>

  <!-- right panel: ANN -->
  <text x="570" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#2c3e50">ANN（近似最近傍探索）</text>
  <rect x="400" y="50" width="340" height="260" rx="8" fill="#f8f9fa" stroke="#d5dbe1"/>

  <!-- clusters not searched -->
  <ellipse cx="458" cy="127" rx="50" ry="52" fill="#eef0f2" stroke="#c8ced4"/>
  <ellipse cx="472" cy="252" rx="58" ry="44" fill="#eef0f2" stroke="#c8ced4"/>
  <!-- cluster searched -->
  <ellipse cx="622" cy="185" rx="74" ry="74" fill="#fdebd0" stroke="#e67e22" stroke-width="2"/>

  <!-- dimmed points -->
  <g fill="#c5cdd6">
    <circle cx="450" cy="100" r="5"/><circle cx="480" cy="130" r="5"/><circle cx="440" cy="150" r="5"/>
    <circle cx="460" cy="240" r="5"/><circle cx="490" cy="270" r="5"/><circle cx="440" cy="270" r="5"/><circle cx="500" cy="230" r="5"/>
  </g>
  <!-- searched points + lines -->
  <g stroke="#e6a23c" stroke-width="1.2">
    <line x1="582" y1="190" x2="600" y2="150"/>
    <line x1="582" y1="190" x2="630" y2="180"/>
    <line x1="582" y1="190" x2="610" y2="210"/>
    <line x1="582" y1="190" x2="650" y2="140"/>
    <line x1="582" y1="190" x2="640" y2="230"/>
  </g>
  <g fill="#4a7ebb">
    <circle cx="600" cy="150" r="5"/><circle cx="630" cy="180" r="5"/><circle cx="610" cy="210" r="5"/>
    <circle cx="650" cy="140" r="5"/><circle cx="640" cy="230" r="5"/>
  </g>
  <g transform="translate(582,190)">
    <polygon points="0,-11 2.65,-3.64 10.46,-3.4 4.28,1.39 6.47,8.9 0,4.5 -6.47,8.9 -4.28,1.39 -10.46,-3.4 -2.65,-3.64" fill="#e74c3c"/>
  </g>
  <text x="565" y="218" text-anchor="middle" font-size="12" fill="#e74c3c">クエリ</text>
  <text x="468" y="75" text-anchor="middle" font-size="11" fill="#8a929a">調べない</text>
  <text x="570" y="338" text-anchor="middle" font-size="13" fill="#555">近そうな領域だけを調べる</text>
</svg>
