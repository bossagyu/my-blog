<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="sans-serif">
  <rect width="760" height="440" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#e74c3c"/>
    </marker>
  </defs>

  <!-- layer planes -->
  <polygon points="180,30 580,30 660,110 260,110" fill="#eef4fb" stroke="#b8cce4"/>
  <polygon points="180,160 580,160 660,240 260,240" fill="#eef4fb" stroke="#b8cce4"/>
  <polygon points="180,290 580,290 660,370 260,370" fill="#eef4fb" stroke="#b8cce4"/>

  <!-- layer labels -->
  <text x="20" y="70" font-size="14" font-weight="bold" fill="#2c3e50">Layer 2</text>
  <text x="20" y="88" font-size="11" fill="#777">まばら・長距離移動</text>
  <text x="20" y="200" font-size="14" font-weight="bold" fill="#2c3e50">Layer 1</text>
  <text x="20" y="330" font-size="14" font-weight="bold" fill="#2c3e50">Layer 0</text>
  <text x="20" y="348" font-size="11" fill="#777">密・全データを含む</text>

  <!-- layer 2 -->
  <line x1="300" y1="70" x2="520" y2="85" stroke="#9bb4d0" stroke-width="1.5"/>
  <circle cx="300" cy="70" r="7" fill="#4a7ebb"/>
  <circle cx="520" cy="85" r="7" fill="#4a7ebb"/>
  <text x="300" y="52" text-anchor="middle" font-size="12" fill="#2c3e50">エントリーポイント</text>

  <!-- layer 1 -->
  <g stroke="#9bb4d0" stroke-width="1.2">
    <line x1="300" y1="200" x2="390" y2="190"/>
    <line x1="390" y1="190" x2="520" y2="215"/>
    <line x1="520" y1="215" x2="590" y2="195"/>
    <line x1="300" y1="200" x2="370" y2="225"/>
  </g>
  <g fill="#4a7ebb">
    <circle cx="300" cy="200" r="6"/><circle cx="390" cy="190" r="6"/>
    <circle cx="520" cy="215" r="6"/><circle cx="590" cy="195" r="6"/><circle cx="370" cy="225" r="6"/>
  </g>

  <!-- layer 0 -->
  <g stroke="#9bb4d0" stroke-width="1">
    <line x1="260" y1="330" x2="320" y2="355"/>
    <line x1="320" y1="355" x2="390" y2="320"/>
    <line x1="390" y1="320" x2="440" y2="350"/>
    <line x1="440" y1="350" x2="500" y2="330"/>
    <line x1="500" y1="330" x2="560" y2="355"/>
    <line x1="560" y1="355" x2="610" y2="325"/>
    <line x1="390" y1="320" x2="500" y2="330"/>
    <line x1="320" y1="355" x2="440" y2="350"/>
  </g>
  <g fill="#4a7ebb">
    <circle cx="260" cy="330" r="5"/><circle cx="320" cy="355" r="5"/><circle cx="390" cy="320" r="5"/>
    <circle cx="440" cy="350" r="5"/><circle cx="560" cy="355" r="5"/><circle cx="610" cy="325" r="5"/>
  </g>

  <!-- search path -->
  <g stroke="#e74c3c" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <line x1="307" y1="71" x2="510" y2="84"/>
    <line x1="520" y1="93" x2="520" y2="205" stroke-dasharray="6,5"/>
    <line x1="514" y1="220" x2="396" y2="192" />
    <line x1="390" y1="198" x2="390" y2="310" stroke-dasharray="6,5"/>
    <line x1="396" y1="322" x2="488" y2="329"/>
  </g>

  <!-- found node -->
  <g transform="translate(500,330)">
    <polygon points="0,-12 2.9,-4 11.4,-3.7 4.7,1.5 7.1,9.7 0,4.9 -7.1,9.7 -4.7,1.5 -11.4,-3.7 -2.9,-4" fill="#e74c3c"/>
  </g>
  <text x="500" y="395" text-anchor="middle" font-size="12" fill="#e74c3c">最近傍（検索結果）</text>

  <!-- legend -->
  <line x1="180" y1="420" x2="220" y2="420" stroke="#e74c3c" stroke-width="2.5"/>
  <text x="228" y="424" font-size="12" fill="#555">探索経路（上の層で大まかに近づき、下の層で精密に探す）</text>
</svg>
